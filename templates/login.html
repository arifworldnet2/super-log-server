<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super LOG - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

    <div class="login-brand-wrapper">
        <div class="login-title">
            <span class="s-badge">S</span>
            <span>Super LOG</span>
        </div>
        <div class="login-subtitle">Enterprise MikroTik Syslog & Traffic Management</div>
    </div>

    <div class="login-card">
        <div style="font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 6px;">Sign In to your session</div>
        <div style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Enter your credentials to access the management portal</div>

        {% if error %}
        <div style="background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="login-input-group">
                <input type="text" name="username" class="form-control" placeholder="User Name" value="arif" required autofocus>
                <i class="fa-solid fa-user input-icon"></i>
            </div>

            <div class="login-input-group">
                <input type="password" name="password" class="form-control" placeholder="Password" value="admin123" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <div style="margin-top: 10px;">
                <button type="submit" class="btn-signin">Sign In to Dashboard</button>
            </div>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 16px;">
            Super LOG v2.0 &bull; Fast MikroTik NAT & PPPoE Accounting Engine
        </div>
    </div>

</body>
</html>
